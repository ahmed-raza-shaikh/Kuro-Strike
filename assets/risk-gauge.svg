<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated risk gauge climbing to a critical score of 88 out of 100">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#0a140d"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4caf3f"/>
      <stop offset="35%" stop-color="#e0c23a"/>
      <stop offset="65%" stop-color="#e0813a"/>
      <stop offset="100%" stop-color="#e03a3a"/>
    </linearGradient>
    <clipPath id="gclip"><rect width="640" height="360" rx="14"/></clipPath>
    <pattern id="ggrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#65a637" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#gclip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="640" height="360" fill="url(#gbg)"/>
    <rect width="640" height="360" fill="url(#ggrid)"/>
    <text x="320" y="34" text-anchor="middle" fill="#a9e78a" font-size="13" letter-spacing="2">COMPOSITE RISK SCORE</text>

    <!-- gauge track -->
    <g transform="translate(320,230)">
      <path d="M -190 0 A 190 190 0 0 1 190 0" fill="none" stroke="#1c2419" stroke-width="26" stroke-linecap="round"/>
      <path d="M -190 0 A 190 190 0 0 1 190 0" fill="none" stroke="url(#arcGrad)" stroke-width="26" stroke-linecap="round"
            stroke-dasharray="597" stroke-dashoffset="597">
        <animate attributeName="stroke-dashoffset" values="597;597;72;72;597" keyTimes="0;0.08;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
      </path>

      <!-- tick labels -->
      <text x="-198" y="26" fill="#5f7a58" font-size="11">0</text>
      <text x="192" y="26" text-anchor="end" fill="#5f7a58" font-size="11">100</text>

      <!-- needle -->
      <g>
        <line x1="0" y1="0" x2="0" y2="-165" stroke="#eafbe0" stroke-width="3" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate"
            values="-90 0 0;-90 0 0;68.4 0 0;68.4 0 0;-90 0 0"
            keyTimes="0;0.08;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle r="9" fill="#0f120f" stroke="#eafbe0" stroke-width="2"/>

      <!-- score readout -->
      <text x="0" y="-40" text-anchor="middle" font-size="46" font-weight="700" fill="#f2d9d9">
        <animate attributeName="fill" values="#bfe8ad;#bfe8ad;#f2d9d9;#f2d9d9;#bfe8ad" keyTimes="0;0.08;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
        88
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.15;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="8" text-anchor="middle" font-size="46" font-weight="700" fill="#bfe8ad" opacity="1">
        0
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.08;0.15;0.85;1" dur="6s" repeatCount="indefinite"/>
      </text>

      <text x="0" y="34" text-anchor="middle" font-size="13" fill="#e0aeae" opacity="0" font-weight="700" letter-spacing="1.5">
        CRITICAL RISK
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.25;0.85;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="320" y="336" text-anchor="middle" fill="#5f7a58" font-size="11">VirusTotal engines · AbuseIPDB confidence · Shodan CVEs — weighted 0–100</text>
  </g>
</svg>
